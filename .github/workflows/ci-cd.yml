name: Secure FastAPI CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run black check
        run: black --check app tests

      - name: Run flake8
        run: flake8 app tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage gate
        env:
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
          DATABASE_URL: sqlite:///./ci_test.db
          ENVIRONMENT: development
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=80

  sast:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Bandit HIGH severity gate
        run: bandit -r app/ -ll -c security/bandit.yml

  dast:
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI app
        env:
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
          DATABASE_URL: sqlite:///./ci_dast.db
          ENVIRONMENT: production
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          sleep 4
          curl --fail http://127.0.0.1:8000/openapi.json

      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --rm --network="host" -v "${{ github.workspace }}:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8000 \
            -c /zap/wrk/security/zap-baseline.conf \
            -J /zap/wrk/zap-report.json \
            -r /zap/wrk/zap-report.html

      - name: Fail pipeline on critical ZAP findings
        run: |
          python - <<'PY'
          import json
          import sys

          with open("zap-report.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          high = 0
          for site in data.get("site", []):
              for alert in site.get("alerts", []):
                  if str(alert.get("riskcode")) == "3":
                      instances = alert.get("instances", [])
                      high += max(1, len(instances))

          print(f"High-risk alerts detected: {high}")
          if high > 0:
              sys.exit(1)
          PY

  build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - sast
      - dast
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build validation
        run: |
          python -m compileall app
          echo "Build completed successfully"
